name: CI

on:
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build Android
        run: bundle exec fastlane build_android
      - name: Test Android
        run: bundle exec fastlane test_android
      - name: Run Android Lint
        id: lint
        continue-on-error: true
        run: |
          mkdir -p Mobile/build/lint
          ./Mobile/gradlew :composeApp:lint --no-daemon 2>&1 | tee Mobile/build/lint/report.txt
          EXIT_CODE=$?
          echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
      - name: Process Android Lint Results
        if: always()
        run: |
          # Parse lint results from XML report
          LINT_REPORT="Mobile/composeApp/build/reports/lint-results.xml"
          if [ -f "$LINT_REPORT" ]; then
            echo "## Android Lint Report" >> $GITHUB_STEP_SUMMARY
            # Count errors and warnings
            ERROR_COUNT=$(grep -c '<issue severity="Error"' "$LINT_REPORT" || echo "0")
            WARNING_COUNT=$(grep -c '<issue severity="Warning"' "$LINT_REPORT" || echo "0")
            echo "- **Errors:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Warnings:** $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Show violations if any
            if [ "$ERROR_COUNT" -gt 0 ] || [ "$WARNING_COUNT" -gt 0 ]; then
              echo "### Violations" >> $GITHUB_STEP_SUMMARY
              grep '<issue ' "$LINT_REPORT" | sed 's/.*<issue severity="\([^"]*\)".*message="\([^"]*\)".*file="\([^"]*\)".*line="\([^"]*\)".*/- [\1] \3:\4 - \2/' >> $GITHUB_STEP_SUMMARY
            fi
          fi
      - name: Upload Android Lint Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: Mobile/composeApp/build/reports/
          retention-days: 30
      - name: Fail if Android Lint Errors Found
        if: steps.lint.outputs.exit-code != '0'
        run: |
          echo "Android Lint found errors. Check the artifacts and the summary above."
          exit 1
      - name: Detect Android
        run: bundle exec fastlane detect_android

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        id: swiftlint
        continue-on-error: true
        run: |
          mkdir -p Mobile/build/swiftlint
          swiftlint --config Mobile/iosApp/.swiftlint.yml --reporter json Mobile/iosApp > Mobile/build/swiftlint/report.json 2>&1
          swiftlint --config Mobile/iosApp/.swiftlint.yml --reporter html Mobile/iosApp > Mobile/build/swiftlint/report.html 2>&1
          swiftlint --config Mobile/iosApp/.swiftlint.yml Mobile/iosApp > Mobile/build/swiftlint/report.txt 2>&1
          EXIT_CODE=$?
          echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
      - name: Process SwiftLint Results
        if: always()
        run: |
          if [ -f Mobile/build/swiftlint/report.json ]; then
            echo "## SwiftLint Report" >> $GITHUB_STEP_SUMMARY
            # Count violations
            ERROR_COUNT=$(jq '[.[] | select(.severity == "error")] | length' Mobile/build/swiftlint/report.json || echo "0")
            WARNING_COUNT=$(jq '[.[] | select(.severity == "warning")] | length' Mobile/build/swiftlint/report.json || echo "0")
            echo "- **Errors:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Warnings:** $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Show violations if any
            if [ "$ERROR_COUNT" -gt 0 ] || [ "$WARNING_COUNT" -gt 0 ]; then
              echo "### Violations" >> $GITHUB_STEP_SUMMARY
              jq -r '.[] | "- [\(.severity | ascii_upcase)] \(.file):\(.line) - \(.message)"' Mobile/build/swiftlint/report.json >> $GITHUB_STEP_SUMMARY
            fi
          fi
      - name: Upload SwiftLint Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-reports
          path: Mobile/build/swiftlint/
          retention-days: 30
      - name: Fail if SwiftLint Errors Found
        if: steps.swiftlint.outputs.exit-code != '0'
        run: |
          echo "SwiftLint found errors. Check the artifacts and the summary above."
          exit 1
      - name: Build iOS
        run: bundle exec fastlane build_ios
      - name: Test iOS
        run: bundle exec fastlane test_ios
